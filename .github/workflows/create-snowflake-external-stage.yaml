  # ---------------------------
  # Snowflake step (all clouds)
  # ---------------------------
  create-snowflake-integration:
    name: Create Snowflake Integration & Stage
    runs-on: ubuntu-latest
    needs: [validate-and-display-inputs, provision-aws-infrastructure] # TODO: Add provision-gcp-infrastructure, provision-azure-infrastructure after testing
    outputs:
      # AWS
      snowflake_principal_arn: ${{ steps.sf.outputs.snowflake_principal_arn }}
      snowflake_external_id: ${{ steps.sf.outputs.snowflake_external_id }}
      # GCP
      snowflake_gcs_service_account: ${{ steps.sf.outputs.snowflake_gcs_service_account }}
      # Azure
      azure_consent_url: ${{ steps.sf.outputs.azure_consent_url }}
      azure_app_name: ${{ steps.sf.outputs.azure_app_name }}
    steps:
      - name: Checkout Repo
        id: checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-and-display-inputs.outputs.checkout-ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install Snowflake connector
        run: |
          python -m pip install --upgrade pip
          pip install snowflake-connector-python cryptography

      - name: Create integration + stage
        id: sf
        env:
          CLOUD_PROVIDER: ${{ inputs.cloud-provider }}
          # Snowflake auth
          SNOWFLAKE_ACCOUNT: ${{ inputs.snowflake-account }}
          SNOWFLAKE_USER: ${{ inputs.snowflake-user }}
          SNOWFLAKE_PRIVATE_KEY_PEM: ${{ secrets.snowflake-private-key-pem }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.snowflake-private-key-passphrase }}
          SNOWFLAKE_ROLE: ${{ inputs.snowflake-role }}
          SNOWFLAKE_WAREHOUSE: ${{ inputs.snowflake-warehouse }}
          # Objects
          INTEGRATION: ${{ inputs.snowflake-integration-name }}
          STAGE: ${{ inputs.snowflake-stage-name }}
          DB: ${{ inputs.snowflake-database }}
          SCHEMA: ${{ inputs.snowflake-schema }}
          # Provider values
          AWS_ROLE_ARN: ${{ needs.provision-aws-infrastructure.outputs.role_arn }}
          STORAGE_URL_AWS: ${{ needs.provision-aws-infrastructure.outputs.storage_url }}
          # TODO: Uncomment after GCP/Azure testing
          # STORAGE_URL_GCP: ${{ needs.provision-gcp-infrastructure.outputs.storage_url }}
          # STORAGE_URL_AZURE: ${{ needs.provision-azure-infrastructure.outputs.storage_url }}
          AZURE_TENANT_ID: ${{ secrets.azure-tenant-id }}
        run: |
          python .github/scripts/snowflake_create_integration_stage.py

  # ---------------------------
  # AWS STEP 2 (Terraform trust finalize)
  # ---------------------------
  finalize-aws-trust-policy:
    if: ${{ inputs.cloud-provider == 'aws' }}
    runs-on: ubuntu-latest
    needs: [validate-and-display-inputs, provision-aws-infrastructure, create-snowflake-integration]
    permissions: { id-token: write, contents: read }
    steps:
      - name: Checkout Repo
        id: checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-and-display-inputs.outputs.checkout-ref }}

      - name: Configure AWS Authentication
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ inputs.aws-region }}
          role-to-assume: ${{ secrets.aws-role-to-assume }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      #  Terraform Cloud Backend #############################################
      - name: Setup Terraform Cloud Credentials
        id: setup-tfc-credentials
        if: inputs.backend-type == 'remote'
        shell: bash
        run: |
          mkdir -p ~/.terraform.d
          cat > ~/.terraform.d/credentials.tfrc.json << EOF
          {
            "credentials": {
              "app.terraform.io": {
                "token": "${{ secrets.tfc-token }}"
              }
            }
          }
          EOF

      - name: Initialize Terraform with HCP Terraform Cloud Backend
        id: terraform-init-remote
        if: inputs.backend-type == 'remote'
        shell: bash
        working-directory: ${{ inputs.tf-dir }}
        run: |
          terraform init -input=false

      #  AWS S3 Backend #############################################
      - name: Generate Terraform State Key
        id: generate-tfstate-key
        if: inputs.backend-type == 's3'
        shell: bash
        run: |
          if [[ "${{ inputs.ci-pipeline }}" == "true" ]]; then
            state_key="${{ github.repository }}/${{ github.sha }}/terraform.tfstate"
          else
            state_key="${{ github.repository }}/terraform.tfstate"
          fi
          echo "state_key=$state_key" >> $GITHUB_OUTPUT

      - name: Initialize Terraform with S3 Backend
        id: terraform-init-s3
        if: inputs.backend-type == 's3'
        shell: bash
        working-directory: ${{ inputs.tf-dir }}
        run: |
          # Build state key with optional prefix
          if [[ -n "${{ inputs.s3-key-prefix }}" ]]; then
            full_key="${{ inputs.s3-key-prefix }}/${{ steps.generate-tfstate-key.outputs.state_key }}"
          else
            full_key="${{ steps.generate-tfstate-key.outputs.state_key }}"
          fi
          
          # Initialize with S3 backend
          terraform init -input=false \
            -backend-config="bucket=${{ inputs.s3-bucket }}" \
            -backend-config="key=$full_key" \
            -backend-config="region=${{ inputs.s3-region }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform apply (finalize trust)
        working-directory: ${{ inputs.tf-dir }}
        run: |
          terraform apply -auto-approve \
            -var="aws_region=${{ inputs.aws-region }}" \
            -var="storage_name=${{ inputs.storage-name }}" \
            -var="storage_prefix=${{ inputs.storage-prefix }}" \
            -var="encryption_key_ref=${{ inputs.encryption-key-ref }}" \
            -var="snowflake_principal_arn=${{ needs.create-snowflake-integration.outputs.snowflake_principal_arn }}" \
            -var="snowflake_external_id=${{ needs.create-snowflake-integration.outputs.snowflake_external_id }}"

